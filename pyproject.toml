[project]
name = "reanmath"
version = "0.3.0"
description = "Local RAG tutor for the Khmer Grade 12 math curriculum, with Khmer-aware segmentation and LaTeX-safe ingestion"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "pypdf>=5.0",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "torchvision>=0.18",
    "khmer-nltk>=1.6",
    "anthropic>=0.122",
    "google-genai>=1.0",
    "kiri-ocr>=0.2.15",
    "pypdfium2>=4.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

# CPU-only PyTorch keeps the install small; macOS wheels come from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
# torchvision (pulled in by kiri-ocr) must come from the same index as torch,
# or its compiled ops (torchvision::nms) fail to load.
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["testing.py", "src/tests"]
python_files = ["test_*.py", "testing.py"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:khmernltk.*"]
